name: Daily Guard List Fetch

on:
  schedule:
   - cron: '0 17 * * *'  
  workflow_dispatch:  # 允许手动触发
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动执行'

jobs:
  fetch-guards:
    runs-on: ubuntu-24.04
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      with:
        # 获取所有历史提交，确保能正确比较差异
        fetch-depth: 0
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: 运行舰长名单抓取脚本
      run: python fetch_guard_list.py
      env:
        # 这里可以添加环境变量，如果需要动态配置参数
        PYTHONUNBUFFERED: 1
    
    - name: 检查文件变更
      id: file_check
      run: |
        if [[ $(git status --porcelain) ]]; then
          echo "changes_detected=true" >> $GITHUB_OUTPUT
          echo "📁 检测到文件变更"
        else
          echo "changes_detected=false" >> $GITHUB_OUTPUT
          echo "📁 没有检测到文件变更"
        fi
    
    - name: 提交变更
      if: steps.file_check.outputs.changes_detected == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add guard_list.csv
        git commit -m "🤖 自动更新舰长名单 [$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')]"
        git push
      env:
        # 使用GitHub Token进行推送
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 任务完成通知
      run: |
        echo "✅ 每日舰长名单抓取任务完成"
        echo "📅 运行时间: $(date)"
        if [ -f "guard_list.csv" ]; then
          echo "📊 数据文件: guard_list.csv"
          # 显示文件最后几行
          tail -5 guard_list.csv
        fi
